schema_version: v1
name: dependency-update-replicated-docs
enabled: true

trigger:
  cron:
    schedule: "0 21 * * 0"
    timezone: "America/Chicago"
    overlap_policy: skip
    timeout: 2h

enable_manual_trigger: true

tags: ["cron", "dependencies", "npm"]
color: cyan

stages:
  - id: start
    label: Start
    entry: true
    on_enter:
      inject: |
        Workflow task: update npm dependencies for replicated-docs.

        This is an unattended dependency maintenance workflow. Before making
        changes, check for an open PR with branch "deps/dependency-update". If
        it exists, fetch that branch, rebase it onto current main, and reuse it.
        Otherwise, create that branch from current main.

        Do not ask for permission to start. Say exactly [PROCEED] after the
        branch is ready.

  - id: working
    label: Working
    triggers:
      - message_contains: "[PROCEED]"
    on_enter:
      dependency_updates:
        ecosystems: [npm]
        paths: ["replicated-docs"]
        output: dependency_updates
        timeout: 30m
      inject: |
        npm dependency updates were applied to replicated-docs.

        Keep the change scoped to package.json, package-lock.json, and narrowly
        required compatibility fixes. Do not modify CI dependencies or files
        outside the replicated-docs repository.

        Review {{ .Outputs.dependency_updates.files_changed }}. Run these exact
        validation commands from the replicated-docs directory:

        - npm ci
        - npm run build

        Fix reasonable compatibility failures. Open or update one grouped PR:

        - Branch: deps/dependency-update
        - Title: [deps] Update replicated-docs npm dependencies
        - Labels: dependencies, npm, type::security
        - Body starts with: "Generated by the replicated-docs dependency-update Factory workflow."

        Say [DONE] with the PR URL only after validation passes and the PR is
        open. If {{ .Outputs.dependency_updates.files_changed }} is empty, say
        [NO_CHANGES].

  - id: no-changes
    label: No Changes
    triggers:
      - message_contains: "[NO_CHANGES]"
    terminal: true

  - id: validate
    label: Validate
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      run:
        command: |
          bash -lc '
            set +e
            tmpdir="$(mktemp -d)"
            cd replicated-docs

            npm ci >"$tmpdir/npm-ci.log" 2>&1
            install_status=$?

            npm run build >"$tmpdir/build.log" 2>&1
            build_status=$?

            jq -n \
              --argjson install_status "$install_status" \
              --argjson build_status "$build_status" \
              --arg install_log "$(tail -c 12000 "$tmpdir/npm-ci.log")" \
              --arg build_log "$(tail -c 12000 "$tmpdir/build.log")" \
              '"'"'{
                status: (if $install_status == 0 and $build_status == 0 then "passed" else "failed" end),
                checks: [
                  {name: "npm ci", exit_code: $install_status, log_tail: $install_log},
                  {name: "npm run build", exit_code: $build_status, log_tail: $build_log}
                ]
              }'"'"'
          '
        output: validation
        timeout: 45m
    gate:
      output: validation
      pass:
        path: status
        values: [passed]
      fail:
        path: status
        values: [failed, error]
      required: true

  - id: fix-validation
    label: Fix Validation
    triggers:
      - gate_result:
          stage: validate
          verdict: fail
    on_enter:
      inject: |
        Validation failed:

        {{ .Outputs.validation.checks }}

        Fix the scoped dependency compatibility failures, commit and push to
        the same PR branch, then say [DONE] with the PR URL again. If the
        failure cannot be fixed safely within scope, explain why and say
        [FAILED].

  - id: failed
    label: Failed
    triggers:
      - message_contains: "[FAILED]"
    terminal: true

  - id: complete
    label: Complete
    triggers:
      - gate_result:
          stage: validate
          verdict: pass
    terminal: true
