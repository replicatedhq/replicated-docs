name: "depot: main"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Automation to run
        required: true
        type: choice
        default: all
        options:
          - all
          - algolia

concurrency:
  group: depot-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  algolia:
    name: Trigger Algolia crawl
    if: >-
      github.event_name == 'push'
      || inputs.target == 'all'
      || inputs.target == 'algolia'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger crawler
        env:
          CRAWLER_ID: ${{ secrets.CRAWLER_ID }}
          CRAWLER_USER_ID: ${{ secrets.CRAWLER_USER_ID }}
          CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --request POST \
            --header 'Content-Type: application/json' \
            --user "${CRAWLER_USER_ID}:${CRAWLER_API_KEY}" \
            "https://crawler.algolia.com/api/1/crawlers/${CRAWLER_ID}/reindex"

